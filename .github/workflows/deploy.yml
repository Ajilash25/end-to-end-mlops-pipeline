
name: MLOps Automated Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  mlops-pipeline:

    runs-on: ubuntu-latest

    steps:

      # STEP 1: Get source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2: Configure Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # STEP 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Prepare datasets
      - name: Prepare Dataset
        run: |
          python src/prepare_data.py

      # STEP 5: Train initial model
      - name: Train Initial Model
        run: |
          python src/train.py

      # STEP 6: Monitor data drift
      - name: Check Data Drift
        id: drift-check
        run: |
          python src/drift_monitor.py

      # STEP 7: Retrain when drift is detected
      - name: Conditional Model Retraining
        if: steps.drift-check.outputs.drift_detected == 'true'
        run: |
          python src/retrain.py

      # STEP 8: Start FastAPI
      - name: Start FastAPI Server
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid

      # STEP 9: Test API health
      - name: Test API Health
        run: |
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          cat api.log
          exit 1

      # STEP 10: Test model prediction
      - name: Test Model Prediction
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[5.1,3.5,1.4,0.2]}'

      # STEP 11: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ajilash25/iris-mlops-api:latest \
            -t ajilash25/iris-mlops-api:${GITHUB_SHA} \
            .

      # STEP 12: Run Docker container
      - name: Run Docker Container
        run: |
          docker run -d \
            --name iris-mlops-test \
            -p 8001:8000 \
            ajilash25/iris-mlops-api:latest

      # STEP 13: Test Docker container health
      - name: Test Docker Health
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs iris-mlops-test
          exit 1

      # STEP 14: Test prediction inside Docker
      - name: Test Docker Prediction
        run: |
          curl -fsS -X POST http://127.0.0.1:8001/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[5.1,3.5,1.4,0.2]}'

      # STEP 15: Stop test container
      - name: Stop Docker Test Container
        if: always()
        run: |
          docker rm -f iris-mlops-test || true

      # STEP 16: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 17: Push Docker image
      - name: Push Docker Image
        run: |
          docker push ajilash25/iris-mlops-api:latest
          docker push ajilash25/iris-mlops-api:${GITHUB_SHA}

      # STEP 18: Upload pipeline artifacts
      - name: Upload Pipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-pipeline-results
          path: |
            model.pkl
            reports/
            api.log
          if-no-files-found: warn
